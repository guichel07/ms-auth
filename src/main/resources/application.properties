quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${UTILISATEUR_NEON}
quarkus.datasource.password=${MOT_DE_PASSE_NEON}
quarkus.datasource.jdbc.url=${NEON_URL}
quarkus.hibernate-orm.generation=update
smallrye.jwt.decrypt.key.string=${CLE_SECRET}
smallrye.jwt.encrypt.relax-key-validation=true

mp.jwt.token.cookie=jwt
mp.jwt.verify.issuer=https://acme.org/issuer


# Active le support CORS
quarkus.http.cors=true

# Autorise uniquement ton application Front-End
quarkus.http.cors.origins=http://localhost:5173

# Autorise les méthodes et les headers nécessaires pour le JSON
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
