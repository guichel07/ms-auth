quarkus.datasource.devservices.enabled=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${UTILISATEUR_NEON}
quarkus.datasource.password=${MOT_DE_PASSE_NEON}
quarkus.datasource.jdbc.url=${NEON_URL}
quarkus.hibernate-orm.database.generation=update

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173,http://localhost:5174,http://217.182.68.66:8100,https://ms-admin.duckdns.org,https://ms-bracket-front.duckdns.org
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,HEAD
quarkus.http.cors.headers=origin,content-type,accept,authorization,x-requested-with
quarkus.http.cors.access-control-allow-credentials=true

quarkus.http.auth.permission.public.paths=/ms-auth/login,/ms-auth/logout,/q/*
quarkus.http.auth.permission.public.policy=permit
quarkus.http.auth.proactive=false

# Swagger UI accessible en prod pour debug (désactivé par défaut par Quarkus hors dev mode).
# `servers` force l'URL de base utilisée par "Try it out" à passer par le bon préfixe Caddy,
# sinon les appels générés depuis Swagger UI perdraient le préfixe /auth en repassant par le proxy.
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.servers=https://ms-admin.duckdns.org/auth

mp.jwt.verify.publickey.location=publicKey.pem
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.token.cookie=jwt
mp.jwt.token.header=Cookie
mp.jwt.verify.issuer=https://acme.org/issuer

# Cookie JWT Secure : false en dev/test (HTTP local), true en prod (derrière le reverse
# proxy HTTPS — voir mamansolution-doc/DEPLOYEMENT §8). Ne jamais forcer true tant que ce
# reverse proxy n'est pas en place, sinon le navigateur rejette purement et simplement le cookie.
%prod.app.cookie.secure=true
